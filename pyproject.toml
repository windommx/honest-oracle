[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisim-deep-core"
version = "4.2.0"
description = "Social-dynamics simulation core: Z3 physics, Gillespie SSA, causal DAG, KKT influence, cognitive bias, event bus, neural-symbolic bridge."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
z3 = ["z3-solver>=4.12"]
test = ["z3-solver>=4.12"]

[tool.setuptools]
packages = ["omnisim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # z3 ships no type stubs
check_untyped_defs = true
files = ["omnisim"]
