name: web-tests

on:
  push:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.eslintrc.json'
      - '.github/workflows/web-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'prisma/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.eslintrc.json'

jobs:
  test:
    runs-on: ubuntu-latest
    name: verify (typecheck · lint · test · build)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Single gate — identical to `npm run verify` locally, so a green
      # CI run means exactly what a green local run means (Loop Engineering:
      # one success criterion, no drift between machine and human).
      - name: Verify
        run: npm run verify
        env:
          # next build needs a DATABASE_URL present at collect-time; a dummy
          # value is enough for the static/route analysis CI performs.
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
