name: web-tests

on:
  push:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/web-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'prisma/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'

jobs:
  test:
    runs-on: ubuntu-latest
    name: vitest + typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (Rush Engine)
        run: npm test
      - name: Type check
        run: npx tsc --noEmit
