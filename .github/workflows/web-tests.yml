name: web-tests

on:
  push:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'prisma/**'
      - 'middleware.ts'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.eslintrc.json'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'scripts/**'
      - '.github/workflows/web-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'components/**'
      - 'prisma/**'
      - 'middleware.ts'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.eslintrc.json'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'scripts/**'
      - '.github/workflows/web-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    name: verify (typecheck · lint · test · build)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Single gate — identical to `npm run verify` locally, so a green
      # CI run means exactly what a green local run means (Loop Engineering:
      # one success criterion, no drift between machine and human).
      - name: Verify
        run: npm run verify
        env:
          # next build needs a DATABASE_URL present at collect-time; a dummy
          # value is enough for the static/route analysis CI performs.
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'

  migrations:
    runs-on: ubuntu-latest
    name: migrations apply cleanly and match the schema
    # A migration that has never been run against a real Postgres is a
    # migration you find out about during a deploy. This job applies every
    # migration from empty, then asks Postgres whether the result actually
    # matches schema.prisma — which catches the classic failure where someone
    # edits the schema and ships without generating the migration for it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: stagelab_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/stagelab_ci?schema=public'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Apply every migration from empty
        run: npx prisma migrate deploy

      - name: Fail if schema.prisma has drifted from the migrations
        # --exit-code makes a non-empty diff a non-zero exit. The comparison is
        # live database → schema file, so it reports exactly what a deploy
        # would have silently failed to create.
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "schema matches migrations"

      - name: Seed the shared universe, and prove it is idempotent
        run: |
          npm run db:seed:stagelab
          npm run db:seed:stagelab

      - name: Migration status is clean
        run: npx prisma migrate status

  audit:
    runs-on: ubuntu-latest
    name: dependency advisories (reporting only)
    # Deliberately non-blocking, and labelled as such rather than pretending
    # otherwise. The remaining production advisories are all in `next` and its
    # transitives (nanoid, postcss) plus `qs` under `stripe`, and the
    # vulnerable range covers every 14.x — there is no patch-level escape, only
    # a major upgrade. A gate that fails on day one gets switched off in a
    # week; this one surfaces the list on every run so the number is visible
    # and a regression is obvious. Make it blocking once Next is upgraded.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Production advisories
        run: npm audit --omit=dev
