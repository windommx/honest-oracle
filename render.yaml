# Render Blueprint for honest-oracle (Bookisdom + NaraClear/lifemap).
#
# Use: in the Render dashboard, "New" -> "Blueprint", point it at this repo/branch. Render
# reads this file and proposes the database + web service below; review and click apply.
#
# What this does NOT do for you (Render Blueprints cannot):
#   - pick a plan/region beyond the defaults below (edit here or in the dashboard first)
#   - fill in NEXTAUTH_URL (needs the URL Render assigns on first deploy — see below)
#   - fill in Stripe keys (optional; only if billing is wanted)
# See docs/DEPLOY-RENDER.md for the full walkthrough, including the one manual step
# (NEXTAUTH_URL) every Blueprint deploy needs on its first run.

databases:
  - name: honest-oracle-db
    databaseName: honest_oracle
    user: honest_oracle
    plan: free # upgrade before real traffic — Free Postgres on Render expires after 90 days

services:
  - type: web
    name: honest-oracle
    runtime: node
    plan: starter # Free web services spin down on idle (cold-start delay); Starter stays up
    region: oregon
    branch: main
    # --include=dev: this repo's build needs devDependencies (typescript, tailwindcss,
    # the prisma CLI for `postinstall`/preDeployCommand, tsx for db:rename) present at
    # build time. Some hosts skip devDependencies when NODE_ENV=production is set; this
    # flag makes the install correct regardless of that, without depending on it.
    buildCommand: npm ci --include=dev && npm run build
    # Next.js's own `next start` does not read $PORT; Render assigns one per instance and
    # expects the process to bind to it, so it is passed explicitly here rather than via
    # package.json's "start" script (which stays plain for local/other-host use).
    startCommand: npx next start -p $PORT
    healthCheckPath: / # the public landing page — renders with no DB/session dependency
    # Runs after build, before the new instance takes traffic. Both steps are idempotent
    # (db:rename only touches tables that still have their pre-rebrand names; db push is
    # always safe to re-run), so this is correct on the FIRST deploy and every one after.
    # If your plan/region does not offer Pre-Deploy Command, run this once by hand instead,
    # from the service's Shell tab in the Render dashboard: npm run db:rename && npx prisma db push
    preDeployCommand: npm run db:rename && npx prisma db push
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: honest-oracle-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Render can't tell you your own service's URL at blueprint-apply time (it doesn't
      # exist yet). Set this by hand ONCE after the first deploy: open the service in the
      # Render dashboard, copy the "onrender.com" URL (or your custom domain) shown at the
      # top, and paste it here as e.g. https://honest-oracle.onrender.com — then redeploy.
      # Login/signup will not work correctly until this is set.
      - key: NEXTAUTH_URL
        sync: false
      - key: FREE_LIFEMAP_DAILY_LIMIT
        value: "3"
      - key: FREE_API_DAILY_LIMIT
        value: "1000"
      # Optional — only needed if Stripe billing (upgrade to Pro) is turned on. Leave unset
      # otherwise; the app runs fine without them (Free plan limits simply always apply).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
